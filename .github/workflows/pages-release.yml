name: Deploy Reviewed Pages Artifact

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character SHA of the reviewed release or rollback commit
        required: true
      reason:
        description: Release or rollback reason for the deployment audit trail
        required: true

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Verify immutable reviewed commit
        env:
          REVIEWED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$REVIEWED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full 40-character lowercase Git commit SHA" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$REVIEWED_COMMIT_SHA" ]]; then
            echo "Checked-out commit does not match commit_sha" >&2
            exit 1
          fi
          echo "Reviewed commit: $actual_sha"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release repository state
        run: npm run release:check

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify source before deployment
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Serve and smoke-test artifact
        run: |
          python3 -m http.server 4173 --directory out >/tmp/toolpilot-http.log 2>&1 &
          echo $! >/tmp/toolpilot-http.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:4173

      - name: Deploy reviewed artifact to Cloudflare Pages
        run: npx --yes wrangler@4.124.0 pages deploy out --project-name toolpilot --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test production
        run: npm run smoke
        env:
          SMOKE_BASE_URL: https://toolpilot.cc

      - name: Stop static server
        if: ${{ always() }}
        run: kill "$(cat /tmp/toolpilot-http.pid)" 2>/dev/null || true
