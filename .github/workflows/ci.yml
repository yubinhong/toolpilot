name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Serve Pages output
        run: |
          npx --yes wrangler@4.124.0 pages dev out --ip 127.0.0.1 --port 4173 >/tmp/toolpilot-pages.log 2>&1 &
          echo $! >/tmp/toolpilot-http.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/toolpilot-pages.log
          exit 1

      - name: Smoke test Pages output
        run: npm run smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:4173

      - name: Stop Pages server
        if: ${{ always() }}
        run: kill "$(cat /tmp/toolpilot-http.pid)" 2>/dev/null || true
